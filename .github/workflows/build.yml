# \file build.yml
# \brief Wayforge CI: builds and tests the C++ core and the websites on every push and pull request
#
# Jobs:
#   golden-checker : checks tools/compare_golden.py against tools/testdata/ (fast, Python only)
#   desktop        : build the C++ core on Ubuntu + Windows, run CTest, smoke-run wf_cli,
#                    then run every golden-file test in data/golden/
#   docker         : build + test inside the team's Ubuntu 24.04 container (Dockerfile /
#                    docker-compose.yml at the repo root) - same as `docker compose run --rm test`
#   web            : build both websites (wayforge/studio-web, wayforge/navigator) and check the
#                    Studio backend parses
#   deploy-navigator : main only - put the Navigator build from web live on the team server
#
# Order: golden-checker runs first; desktop and docker only start if it passes,
# so a broken checker can't make the golden tests pass by mistake. web is independent
# of all three and runs straight away.
#
# The project used to ship an Android app, so there was a job here that cross-compiled
# libwayforge.so for the NDK. It went when the product became a website; the old phone
# app is kept as a prototype in wayforge/android-prototype and is not built by CI.
#
# \author Joel Chua (c.jialiang@digipen.edu)
#
# Contribution: Joel Chua 100%
#   - Multi-OS desktop build + CTest + wf_cli smoke run + golden-file tests
#   - Self-test job for the golden checker
#   - Docker job so CI and the team's container build the same way
#   - Web job for the Studio and Navigator websites and the Studio's Node backend
#
# AI declaration: Claude Opus was used as a support tool for debugging, build infrastructure and the header comments.
#
# \date 2026-10-21
# \copyright 2026 DigiPen Institute of Technology Singapore. All rights reserved.
#
name: build

# When CI runs: every push to any branch, PRs into main, and the manual
# "Run workflow" button on the Actions tab.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# If you push again before the last run finishes, cancel the old run on that branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every "run:" step uses bash (also on Windows) and starts inside wayforge/.
defaults:
  run:
    shell: bash
    working-directory: wayforge

jobs:
  # ------------------------------------------------------------------ golden-checker
  # Make sure compare_golden.py itself works before trusting it in the other jobs.
  golden-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # get the repo
      - uses: actions/setup-python@v5      # any Python 3 is fine
        with:
          python-version: "3.x"
      - name: Self-test compare_golden.py
        run: |
          # same geometry, different ids -> must match (exit 0)
          python tools/compare_golden.py tools/testdata/actual_same.wfb tools/testdata/expected.wfb
          # wrong geometry -> must report a mismatch (exit 1)
          # set +e: a non-zero exit is expected here, so don't stop the step on it.
          set +e
          python tools/compare_golden.py tools/testdata/actual_wrong.wfb tools/testdata/expected.wfb
          [ $? -eq 1 ] || { echo "compare_golden.py did not catch the wrong file"; exit 1; }

  # ------------------------------------------------------------------ desktop
  # Build and test the C++ core on Linux and Windows.
  desktop:
    needs: golden-checker
    strategy:
      fail-fast: false                     # let Windows finish even if Linux fails (and the other way round)
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CONFIG: Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5      # needed for run_golden.py
        with:
          python-version: "3.x"
      - name: Install Ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Linux uses Ninja; Windows uses CMake's default (Visual Studio), so GEN stays empty there.
      - name: Configure
        run: |
          GEN=""
          if [ "$RUNNER_OS" = "Linux" ]; then GEN="-G Ninja"; fi
          cmake -S core -B build/desktop $GEN -DCMAKE_BUILD_TYPE=$CONFIG

      - name: Build
        run: cmake --build build/desktop --config $CONFIG --parallel

      # --output-on-failure prints a failing test's log.
      - name: Unit tests (CTest)
        run: ctest --test-dir build/desktop --output-on-failure -C $CONFIG

      # Find the wf_cli binary (its folder differs between Ninja and Visual Studio builds),
      # check it runs, and save its path in $CLI for the next step.
      - name: Smoke run wf_cli
        run: |
          CLI=$(find build/desktop/Sandbox/wf_cli -maxdepth 2 -type f \( -name wf_cli -o -name wf_cli.exe \) | head -n 1)
          [ -n "$CLI" ] || { echo "wf_cli not found"; exit 1; }
          echo "CLI=$CLI" >> "$GITHUB_ENV"
          "$CLI" --version

      # Convert every plan that has a golden file and compare (see tools/run_golden.py).
      - name: Golden-file tests
        run: python tools/run_golden.py "$CLI"

  # ------------------------------------------------------------------ docker
  # Build and test inside the same container teammates use locally.
  docker:
    needs: golden-checker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .           # docker-compose.yml is at the repo root, not in wayforge/
    steps:
      - uses: actions/checkout@v4
      - name: Build dev image (Ubuntu 24.04)
        run: docker compose build
      - name: Build + test in container
        run: docker compose run --rm -T test   # -T: no terminal on CI runners

  # ------------------------------------------------------------------ web
  # Build the two websites (Studio, Navigator). Runs on its own (no C++ needed), so it finishes early
  # and a broken website is reported even while the core build is still going.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"                 # current LTS; the Navigator's Vite 8 needs 20.19+, studio-web 18+
          cache: npm                         # reuse ~/.npm between runs so npm ci is quick
          cache-dependency-path: |
            wayforge/studio-web/package-lock.json
            wayforge/navigator/package-lock.json

      # Studio website (Katie, wayforge/studio-web): React + Vite.
      # npm ci installs exactly what package-lock.json pins, and fails if the two
      # files disagree - so a dependency added without the lockfile turns CI red.
      - name: Install Studio dependencies
        working-directory: wayforge/studio-web
        run: npm ci

      # The Unity WebGL viewer isn't in the repo; vite.config.js skips dist/viewer when
      # it is missing, so this builds fine without Unity on the runner.
      - name: Build the Studio website
        working-directory: wayforge/studio-web
        run: npm run build

      # The backend has no npm packages and no tests yet, so just check Node can
      # parse it - that catches a typo before it reaches the VM.
      - name: Check the Studio backend parses
        working-directory: wayforge/studio-web
        run: node --check server/server.mjs

      # Navigator website (site 2, wayforge/navigator): React + Vite + TypeScript, no backend.
      # npm run build also type-checks (tsc -b), so a type error turns CI red too.
      - name: Install Navigator dependencies
        working-directory: wayforge/navigator
        run: npm ci

      - name: Build the Navigator website
        working-directory: wayforge/navigator
        run: npm run build

      # The built sites appear on the run's summary page.
      # path: is relative to the repo root, not to working-directory above.
      - uses: actions/upload-artifact@v4
        with:
          name: studio-web-dist
          path: wayforge/studio-web/dist

      - uses: actions/upload-artifact@v4
        with:
          name: navigator-dist
          path: wayforge/navigator/dist

  # ------------------------------------------------------------------ deploy-navigator
  # Put the Navigator live (https://navigation.duckdns.org) when main changes, using the site the
  # web job just built, so the live site always matches main. Also runs from the Actions tab's
  # "Run workflow" button on main. Same release folders as deploy.bat (undo: deploy/README.md).
  # The deploy key can only run deploy/server/navigator-deploy.sh on the server (forced command),
  # and its secrets sit in the "navigator-live" environment, which only main is allowed to use.
  deploy-navigator:
    needs: web
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: navigator-live
      url: https://navigation.duckdns.org
    concurrency:
      group: deploy-navigator
      cancel-in-progress: false              # let a running deploy finish; the next one waits
    defaults:
      run:
        shell: bash                          # bash -eo pipefail: a failed tar stops the upload too
        working-directory: .                 # no checkout here, so there is no wayforge/ folder
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: navigator-dist
          path: dist

      # Private key and the server's pinned host key, from the environment's secrets. Until they
      # are set up (deploy/README.md) the job only warns, so main doesn't go red because of it.
      - name: Set up the deploy key
        env:
          DEPLOY_KEY: ${{ secrets.NAVIGATOR_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.NAVIGATOR_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::warning::Navigator not deployed: deploy secrets are not set up (see wayforge/navigator/deploy/README.md)"
            echo "SKIP_DEPLOY=1" >> "$GITHUB_ENV"
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/navigator_deploy
          chmod 600 ~/.ssh/navigator_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # One connection: the built site goes in on stdin, the server script checks it and makes it live.
      # StrictHostKeyChecking=yes: refuse to connect if the server's host key ever changes.
      - name: Upload and make live
        if: env.SKIP_DEPLOY != '1'
        run: |
          tar -czf - -C dist . | ssh -i ~/.ssh/navigator_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes team27@51.79.243.238
