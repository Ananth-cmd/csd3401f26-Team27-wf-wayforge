# \file build.yml
# \brief Wayforge CI: builds and tests the C++ core on every push and pull request
#
# Jobs:
#   golden-checker : checks tools/compare_golden.py against tools/testdata/ (fast, Python only)
#   desktop        : build the C++ core on Ubuntu + Windows, run CTest, smoke-run wf_cli,
#                    then run every golden-file test in data/golden/
#   android        : build libwayforge.so for arm64-v8a with the NDK
#   docker         : build + test inside the team's Ubuntu 24.04 container (Dockerfile /
#                    docker-compose.yml at the repo root) - same as `docker compose run --rm test`
#
# Order: golden-checker runs first; desktop and docker only start if it passes,
# so a broken checker can't make the golden tests pass by mistake.
#
# \author Joel Chua (c.jialiang@digipen.edu)
#
# Contribution: Joel Chua 100%
#   - Multi-OS desktop build + CTest + wf_cli smoke run + golden-file tests
#   - Self-test job for the golden checker
#   - Docker job so CI and the team's container build the same way
#
# AI declaration: Claude Opus was used as a support tool for debugging, build infrastructure and the header comments.
#
# \date 2026-09-15
# \copyright 2026 DigiPen Institute of Technology Singapore. All rights reserved.
#
name: build

# When CI runs: every push to any branch, PRs into main, and the manual
# "Run workflow" button on the Actions tab.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# If you push again before the last run finishes, cancel the old run on that branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every "run:" step uses bash (also on Windows) and starts inside wayforge/.
defaults:
  run:
    shell: bash
    working-directory: wayforge

jobs:
  # ------------------------------------------------------------------ golden-checker
  # Make sure compare_golden.py itself works before trusting it in the other jobs.
  golden-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # get the repo
      - uses: actions/setup-python@v5      # any Python 3 is fine
        with:
          python-version: "3.x"
      - name: Self-test compare_golden.py
        run: |
          # same geometry, different ids -> must match (exit 0)
          python tools/compare_golden.py tools/testdata/actual_same.wfb tools/testdata/expected.wfb
          # wrong geometry -> must report a mismatch (exit 1)
          # set +e: a non-zero exit is expected here, so don't stop the step on it.
          set +e
          python tools/compare_golden.py tools/testdata/actual_wrong.wfb tools/testdata/expected.wfb
          [ $? -eq 1 ] || { echo "compare_golden.py did not catch the wrong file"; exit 1; }

  # ------------------------------------------------------------------ desktop
  # Build and test the C++ core on Linux and Windows.
  desktop:
    needs: golden-checker
    strategy:
      fail-fast: false                     # let Windows finish even if Linux fails (and the other way round)
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CONFIG: Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5      # needed for run_golden.py
        with:
          python-version: "3.x"
      - name: Install Ninja (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Linux uses Ninja; Windows uses CMake's default (Visual Studio), so GEN stays empty there.
      - name: Configure
        run: |
          GEN=""
          if [ "$RUNNER_OS" = "Linux" ]; then GEN="-G Ninja"; fi
          cmake -S core -B build/desktop $GEN -DCMAKE_BUILD_TYPE=$CONFIG

      - name: Build
        run: cmake --build build/desktop --config $CONFIG --parallel

      # --output-on-failure prints a failing test's log.
      - name: Unit tests (CTest)
        run: ctest --test-dir build/desktop --output-on-failure -C $CONFIG

      # Find the wf_cli binary (its folder differs between Ninja and Visual Studio builds),
      # check it runs, and save its path in $CLI for the next step.
      - name: Smoke run wf_cli
        run: |
          CLI=$(find build/desktop/Sandbox/wf_cli -maxdepth 2 -type f \( -name wf_cli -o -name wf_cli.exe \) | head -n 1)
          [ -n "$CLI" ] || { echo "wf_cli not found"; exit 1; }
          echo "CLI=$CLI" >> "$GITHUB_ENV"
          "$CLI" --version

      # Convert every plan that has a golden file and compare (see tools/run_golden.py).
      - name: Golden-file tests
        run: python tools/run_golden.py "$CLI"

  # ------------------------------------------------------------------ docker
  # Build and test inside the same container teammates use locally.
  docker:
    needs: golden-checker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .           # docker-compose.yml is at the repo root, not in wayforge/
    steps:
      - uses: actions/checkout@v4
      - name: Build dev image (Ubuntu 24.04)
        run: docker compose build
      - name: Build + test in container
        run: docker compose run --rm -T test   # -T: no terminal on CI runners

  # ------------------------------------------------------------------ android
  # Cross-compile the Unity plugin (libwayforge.so) and upload it as a downloadable artifact.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      # GitHub's Ubuntu runners come with the Android NDK; point the build script at it.
      - name: Build libwayforge.so (arm64-v8a)
        run: ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" bash ./core/script_build_android.sh
      # Uploaded file appears on the run's summary page.
      - uses: actions/upload-artifact@v4
        with:
          name: libwayforge-android-arm64-v8a
          path: wayforge/unity/Assets/Wayforge/Plugins/Android/libs/arm64-v8a/libwayforge.so
