# \file nginx-site2-site.conf
# \brief The Navigator site itself (static files), included by its https server
#
# On the VM this file is /etc/nginx/snippets/site2-site.conf, included by nginx-site2.conf.
# The Navigator has no backend of its own: it runs in the browser and (later) reads published
# buildings from the Studio's GET /api/published.
#
# \author Joel Chua (c.jialiang@digipen.edu)
# AI declaration: Claude Opus was used as a support tool for debugging, build infrastructure and the header comments.
# \date 2026-10-23
# \copyright 2026 DigiPen Institute of Technology Singapore. All rights reserved.

# /var/www/site2/current is a link to the live upload in /var/www/site2/releases/<date>
# (made by wayforge/navigator/deploy/deploy.bat), so a bad upload can be undone.
root /var/www/site2/current;
index index.html;

# Any page that isn't a real file falls back to index.html (the Navigator is a single-page app).
location / { try_files $uri $uri/ /index.html; }
