# \file nginx-site2-site.conf
# \brief The Navigator site itself (files + /api), shared by its http and https servers
#
# On the VM this file is /etc/nginx/snippets/site2-site.conf, included by nginx-site2.conf in
# both the :5001 (http) and :443 (https) servers, so the two can't drift apart.
#
# \author Joel Chua (c.jialiang@digipen.edu)
# AI declaration: Claude Opus was used as a support tool for debugging, build infrastructure and the header comments.
# \date 2026-10-22
# \copyright 2026 DigiPen Institute of Technology Singapore. All rights reserved.

# /var/www/site2/current is a link to the live upload in /var/www/site2/releases/<date>
# (made by wayforge/navigator/deploy/deploy.bat), so a bad upload can be undone.
root /var/www/site2/current;
index index.html;

# Any page that isn't a real file falls back to index.html (the Navigator is a single-page app).
location / { try_files $uri $uri/ /index.html; }

# Everything under /api/ goes to the backend (site2-backend.service). Placeholder for now.
location /api/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20M;      # largest upload the backend will accept
}
