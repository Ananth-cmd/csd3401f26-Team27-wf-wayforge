# \file nginx-site2.conf
# \brief nginx servers for site 2 (the Navigator): https://navigation.duckdns.org
#
# On the VM this file is /etc/nginx/sites-available/site2, linked from sites-enabled/.
# The site itself is in nginx-site2-site.conf (/etc/nginx/snippets/site2-site.conf).
#
#   :80    Let's Encrypt's certificate checks, and sends everyone else to https
#   :443   https://navigation.duckdns.org
# (the old plain-http address on :5001 was removed to keep fewer ports open)
#
# The certificate is from Let's Encrypt (certbot certonly --webroot -w /var/www/letsencrypt
# -d navigation.duckdns.org). certbot's timer renews it, and the hook in
# /etc/letsencrypt/renewal-hooks/deploy reloads nginx afterwards (both set up with the Studio).
#
# \author Joel Chua (c.jialiang@digipen.edu)
# AI declaration: Claude Opus was used as a support tool for debugging, build infrastructure and the header comments.
# \date 2026-10-23
# \copyright 2026 DigiPen Institute of Technology Singapore. All rights reserved.
server {
    listen 80;
    listen [::]:80;
    server_name navigation.duckdns.org;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name navigation.duckdns.org;
    ssl_certificate     /etc/letsencrypt/live/navigation.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/navigation.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:site2_ssl:10m;
    include snippets/site2-site.conf;
}
