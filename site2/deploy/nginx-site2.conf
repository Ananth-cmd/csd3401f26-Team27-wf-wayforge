# \file nginx-site2.conf
# \brief nginx config for site 2: frontend files + /api/ forwarded to the backend
#
# On the VM this file is /etc/nginx/sites-available/site2, linked from sites-enabled/.
# Same layout as Studio's config (port 5000 -> backend on 8080); site 2 uses 5001 -> 8081.
# When the domain and port 443 are ready, this gets a server_name and certbot adds HTTPS.
#
# /var/www/site2/current is a link to the live upload in /var/www/site2/releases/<date>,
# so a bad upload can be undone by pointing the link back at the previous folder.
#
# \author Joel Chua (c.jialiang@digipen.edu)
# AI declaration: Claude Opus was used as a support tool for debugging, build infrastructure and the header comments.
# \date 2026-10-21
# \copyright 2026 DigiPen Institute of Technology Singapore. All rights reserved.
server {
    listen 5001;
    root /var/www/site2/current;
    index index.html;

    # Any page that isn't a real file falls back to index.html (for single-page apps).
    location / { try_files $uri $uri/ /index.html; }

    # Everything under /api/ goes to the backend (deploy/site2-backend.service).
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;      # largest upload the backend will accept
    }
}
