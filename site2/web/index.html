<!doctype html>
<!--
  \file index.html
  \brief Site 2 placeholder page - shows the site is up and whether the backend answers

  Served by nginx from /var/www/site2/current (deploy/nginx-site2.conf).
  Calls /api/health, which nginx forwards to the backend (server/server.mjs).

  \author Joel Chua (c.jialiang@digipen.edu)
  AI declaration: Claude Opus was used as a support tool for debugging, build infrastructure and the header comments.
  \date 2026-10-21
  \copyright 2026 DigiPen Institute of Technology Singapore. All rights reserved.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site 2</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 4rem auto; padding: 0 1rem; color: #222; background: #fafafa; }
    .ok { color: #1a7f37; } .bad { color: #b42318; }
  </style>
</head>
<body>
  <h1>Site 2: coming soon</h1>
  <p>Backend status: <strong id="status">checking...</strong></p>
  <script>
    // Ask the backend (through nginx) whether it is running.
    fetch("/api/health")
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(d => { const s = document.getElementById("status"); s.textContent = d.status; s.className = "ok"; })
      .catch(() => { const s = document.getElementById("status"); s.textContent = "not reachable"; s.className = "bad"; });
  </script>
</body>
</html>
